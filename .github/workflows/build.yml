on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
jobs:
  test_qt612:
    name: Qt 6.12.0
    runs-on: ubuntu-26.04
    container:
      image: carlonluca/qt-dev:6.12.0-win
    steps:
      - name: Setup CI
        run: apt-get update && apt-get install -y nodejs npm
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Build
        run: |
          mkdir build
          cd build
          /opt/mxe/usr/i686-w64-mingw32.static/qt6/bin/qmake ..
          make